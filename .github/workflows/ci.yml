name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
        compiler:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
        exclude:
          - os: windows-latest
            compiler:
              cc: gcc
              cxx: g++
          - os: windows-latest
            compiler:
              cc: clang
              cxx: clang++
          - os: macos-latest
            compiler:
              cc: gcc
              cxx: g++
        include:
          - os: windows-latest
            build_type: Debug
            compiler:
              cc: cl
              cxx: cl
          - os: windows-latest
            build_type: Release
            compiler:
              cc: cl
              cxx: cl

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} ${{ matrix.compiler.cxx }} ${{ matrix.build_type }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up compiler (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "CC=${{ matrix.compiler.cc }}" >> $GITHUB_ENV
          echo "CXX=${{ matrix.compiler.cxx }}" >> $GITHUB_ENV

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run tests
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure
